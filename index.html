<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2E59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Budget Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--navy:#0B2E59;--navy2:#123A6B;--orange:#FF7A1A;--orange-soft:#FFF1E6;--bg:#F4F6FA;--card:#fff;--text:#122A4A;--muted:#71829B;--line:#E6EBF3;--green:#12996A;--red:#E23B3B;--amber:#B7791F;--radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:86px;position:relative}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header.top .brand{font-weight:700;font-size:16px;flex:1}
.monthsel{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border-radius:12px;padding:3px 5px}
.monthsel button{background:rgba(255,255,255,.16);color:#fff;border:0;width:26px;height:26px;border-radius:8px;font-size:15px}
.monthsel .mval{color:#fff;font-weight:600;font-size:12.5px;min-width:72px;text-align:center}
main{padding:14px 14px 0}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(16,38,74,.05);border:1px solid var(--line);margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0}
.hero .lbl{opacity:.8;font-size:13px}
.hero .big{font-size:29px;font-weight:700;letter-spacing:-.5px;margin:2px 0 2px}
.hero .sub{display:flex;gap:16px;opacity:.9;font-size:12.5px;margin-top:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:16px;font-weight:700;margin-top:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar{height:8px;background:#EDF1F7;border-radius:8px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--orange);border-radius:8px}
.bar.navy>i{background:var(--navy)}.bar.green>i{background:var(--green)}.bar.red>i{background:var(--red)}
.muted{color:var(--muted)}
.sec-title{font-size:12.5px;font-weight:700;color:var(--navy);margin:16px 4px 8px;text-transform:uppercase;letter-spacing:.6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.orange{background:var(--orange)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.wide{width:100%}.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;color:var(--text);font-family:inherit}
input:focus
